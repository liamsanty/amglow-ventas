# Pruebas: corren en cada push a ramas de trabajo y a develop.
# El resultado aparece dentro del PR porque es el mismo commit.
# (No se usa el evento pull_request: con los PR que abre auto-pr.yml queda
#  como "action_required" y solo genera ruido.)
# Si fallan, el PR queda marcado en rojo y no se debe mergear.
name: Pruebas

on:
  push:
    branches-ignore: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Revisar sintaxis PHP
        run: find app routes config database -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Correr pruebas
        run: php artisan test
